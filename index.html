
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadowing AI</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;color:#19243a;margin:0;padding:16px}
main{max-width:680px;margin:auto}
h1{text-align:center}
section{background:white;padding:15px;border-radius:14px;margin:14px 0}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px}
button{background:#345fe5;color:white;border:0;padding:11px;border-radius:9px;margin:5px 0}
.row{display:flex;gap:7px}
.row button{flex:1}
#player{width:100%;aspect-ratio:16/9;background:#111;margin:15px 0}
.line{display:block;width:100%;text-align:left;background:#edf1fa;color:#15243c;padding:12px;margin:7px 0;line-height:1.5}
.active{background:#ccdfff;border:2px solid #345fe5}
small{color:#536782}
</style>
</head>
<body>
<main>
<h1>🎧 Shadowing AI</h1>
<section>
<p>貼上 YouTube 影片連結</p>
<input id="url" placeholder="YouTube URL">
<button onclick="loadVideo()">載入影片</button>
<div id="player"></div>
<div class="row">
<button onclick="play()">▶ 播放</button>
<button onclick="pause()">⏸ 暫停</button>
</div>
<p>播放速度</p>
<select id="speed" onchange="speed()">
<option value=".5">0.5×</option>
<option value=".75">0.75×</option>
<option value="1" selected>1×</option>
<option value="1.25">1.25×</option>
<option value="1.5">1.5×</option>
</select>
<p id="status">尚未載入影片</p>
</section>

<section>
<h2>字幕與跟讀</h2>
<p><small>可從 iPhone 檔案 App 選取 SRT 或 VTT 字幕。</small></p>
<input type="file" id="file" accept=".srt,.vtt,.txt">
<p>或者貼上字幕內容</p>
<textarea id="raw" rows="4" placeholder="貼上含時間戳的字幕"></textarea>
<button onclick="importSubs()">讀取字幕</button>
<div class="row">
<button onclick="previous()">⏮ 上一句</button>
<button onclick="repeatLine()">↻ 重播</button>
<button onclick="next()">下一句 ⏭</button>
</div>
<p><label><input id="loop" type="checkbox" checked style="width:auto"> 單句循環</label></p>
<div id="lines"></div>
</section>
</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player=null,ready=false,cues=[],selected=-1,timer=null;
const el=id=>document.getElementById(id);
function onYouTubeIframeAPIReady(){ready=true}
function videoId(s){
try{
let u=new URL(s),h=u.hostname,id="";
if(h==="youtu.be"||h==="www.youtu.be")
id=u.pathname.split("/")[1];
else if(["youtube.com","www.youtube.com","m.youtube.com"].includes(h)){
if(u.pathname==="/watch")id=u.searchParams.get("v");
else id=u.pathname.split("/")[2];
}
return /^[\w-]{11}$/.test(id||"")?id:null;
}catch{return null}
}
function stopLoop(){clearInterval(timer);timer=null}
function loadVideo(){
let id=videoId(el("url").value.trim());
if(!id){el("status").textContent="請輸入有效網址";return}
if(!ready){el("status").textContent="播放器還沒準備好";return}
stopLoop();
if(player&&player.destroy)player.destroy();
el("player").outerHTML='<div id="player"></div>';
player=new YT.Player("player",{
videoId:id,
playerVars:{playsinline:1},
events:{onReady:()=>el("status").textContent="影片已載入"}
});
}
function play(){if(player?.playVideo)player.playVideo()}
function pause(){if(player?.pauseVideo)player.pauseVideo()}
function speed(){
if(player?.setPlaybackRate)
player.setPlaybackRate(Number(el("speed").value));
}
function seconds(s){
let p=s.replace(",",".").trim().split(":").map(Number);
return p.reduce((a,b)=>a*60+b,0);
}
function parseSubs(text){
let result=[];
for(let block of text.replace(/\r/g,"").split(/\n\s*\n/)){
let rows=block.trim().split("\n");
let i=rows.findIndex(x=>x.includes("-->"));
if(i<0)continue;
let parts=rows[i].split("-->").map(x=>x.trim().split(/\s+/)[0]);
let start=seconds(parts[0]),end=seconds(parts[1]);
let words=rows.slice(i+1).join(" ").replace(/<[^>]+>/g,"").trim();
if(Number.isFinite(start)&&Number.isFinite(end)&&end>start&&words)
result.push({start,end,text:words});
}
return result.sort((a,b)=>a.start-b.start);
}
function importSubs(){
stopLoop();
cues=parseSubs(el("raw").value);
selected=-1;
render();
el("status").textContent="已讀取 "+cues.length+" 段字幕";
}
el("file").onchange=async e=>{
let f=e.target.files[0];
if(f){el("raw").value=await f.text();importSubs()}
};
function stamp(n){
return String(Math.floor(n/60)).padStart(2,"0")+":"+
String(Math.floor(n%60)).padStart(2,"0");
}
function render(){
let root=el("lines");
root.replaceChildren();
cues.forEach((c,i)=>{
let b=document.createElement("button");
b.className="line"+(i===selected?" active":"");
b.textContent=stamp(c.start)+" — "+c.text;
b.onclick=()=>choose(i);
root.appendChild(b);
});
}
function choose(i){
if(i<0||i>=cues.length)return;
selected=i;
render();
let c=cues[i];
stopLoop();
if(player?.seekTo){
player.seekTo(c.start,true);
player.playVideo();
speed();
}
timer=setInterval(()=>{
if(!player?.getCurrentTime)return;
if(player.getCurrentTime()>=c.end-.1){
if(el("loop").checked){
player.seekTo(c.start,true);
player.playVideo();
}else{
player.pauseVideo();
stopLoop();
}
}
},200);
}
function repeatLine(){if(selected>=0)choose(selected)}
function previous(){if(cues.length)choose(Math.max(0,selected-1))}
function next(){if(cues.length)choose(Math.min(cues.length-1,selected+1))}
</script>
  
<section>
  <h2>🎙️ 我的英文跟讀錄音</h2>
  <p>聽完原聲後，錄下自己的發音。</p>

  <div class="row">
    <button id="recordStart" onclick="startRecording()">
      🔴 開始錄音
    </button>
    <button id="recordStop" onclick="stopRecording()" disabled>
      ⏹ 停止錄音
    </button>
  </div>

  <p id="recordStatus">尚未錄音</p>

  <audio id="myRecording" controls
    style="width:100%;margin-top:10px"></audio>

  <p>
    <small>
      錄音只會保存在目前瀏覽器頁面中，
      不會自動上傳到伺服器。
      重新整理後可能消失。
    </small>
  </p>
</section>

<script>
let recorder = null;
let recordingChunks = [];
let micStream = null;
let recordingURL = null;

async function startRecording() {
  const message = document.getElementById("recordStatus");

  if (!navigator.mediaDevices?.getUserMedia ||
      !window.MediaRecorder) {
    message.textContent = "目前瀏覽器不支援錄音";
    return;
  }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    const options = {};
    if (MediaRecorder.isTypeSupported("audio/mp4")) {
      options.mimeType = "audio/mp4";
    } else if (
      MediaRecorder.isTypeSupported("audio/webm")
    ) {
      options.mimeType = "audio/webm";
    }

    recorder = new MediaRecorder(micStream, options);
    recordingChunks = [];

    recorder.ondataavailable = event => {
      if (event.data.size > 0) {
        recordingChunks.push(event.data);
      }
    };

    recorder.onstop = () => {
      const blob = new Blob(recordingChunks, {
        type: recorder.mimeType || "audio/mp4"
      });

      if (recordingURL) {
        URL.revokeObjectURL(recordingURL);
      }

      recordingURL = URL.createObjectURL(blob);
      document.getElementById("myRecording").src =
        recordingURL;

      message.textContent = "✅ 錄音完成！可以按播放聽自己的聲音";

      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
    };

    if (typeof stopLoop === "function") stopLoop();
    if (typeof pause === "function") pause();

    recorder.start();

    document.getElementById("recordStart").disabled = true;
    document.getElementById("recordStop").disabled = false;
    message.textContent = "🔴 正在錄音中…";

  } catch (error) {
    message.textContent =
      "無法錄音，請確認已允許麥克風權限";
    if (micStream) {
      micStream.getTracks().forEach(track => track.stop());
    }
  }
}

function stopRecording() {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
  }

  document.getElementById("recordStart").disabled = false;
  document.getElementById("recordStop").disabled = true;
}
</script>

<!-- Shadowing AI V2 Upgrade -->
<style>
body {
  padding-bottom: 125px;
}
#v2bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 999;
  background: #19281c;
  color: #eef5e7;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  box-shadow: 0 -4px 25px #0003;
}
#v2time {
  font-size: 12px;
  color: #b8d5aa;
  margin-bottom: 7px;
}
#v2progress {
  height: 5px;
  background: #465946;
  border-radius: 9px;
  overflow: hidden;
  margin-bottom: 12px;
}
#v2fill {
  height: 100%;
  width: 0%;
  background: #a5e57d;
}
#v2buttons {
  display: flex;
  justify-content: space-around;
  gap: 4px;
}
#v2buttons button {
  flex: 1;
  min-width: 0;
  background: transparent;
  color: white;
  padding: 7px 1px;
  font-size: 12px;
  margin: 0;
}
#v2buttons button span {
  display: block;
  font-size: 21px;
  margin-bottom: 4px;
}
#v2buttons button.on {
  color: #adf18d;
}
#lines .line.playing {
  background: #e0f3da;
  border: 2px solid #67a747;
}
#v2current {
  background: #edf5e8;
  border-radius: 13px;
  padding: 14px;
  margin: 12px 0;
  line-height: 1.6;
}
#v2saved {
  background: white;
  padding: 15px;
  border-radius: 14px;
  margin: 15px 0;
}
</style>

<div id="v2bar">
  <div id="v2time">00:00 / 00:00</div>
  <div id="v2progress">
    <div id="v2fill"></div>
  </div>
  <div id="v2buttons">
    <button id="v2pin" onclick="v2Pin()">
      <span>📌</span>固定
    </button>
    <button id="v2loop" class="on"
      onclick="v2Loop()">
      <span>🔁</span>重複
    </button>
    <button id="v2speed" onclick="v2Speed()">
      <span>⚡</span>1×
    </button>
    <button onclick="v2Play()">
      <span>⏯</span>播放
    </button>
    <button id="v2mic" onclick="v2Record()">
      <span>🎙️</span>錄音
    </button>
  </div>
</div>

<script>
const v2SavedKey = "shadowing-v2-saved";
let v2Last = -1;

function v2Time(t) {
  t = Math.max(0, Math.floor(t || 0));
  return String(Math.floor(t / 60)).padStart(2,"0")
    + ":" + String(t % 60).padStart(2,"0");
}

function v2Loop() {
  const box = document.getElementById("loop");
  box.checked = !box.checked;
  document.getElementById("v2loop")
    .classList.toggle("on",box.checked);
}

function v2Speed() {
  const box = document.getElementById("speed");
  const speeds = [0.5,0.75,1,1.25,1.5];
  const current = Number(box.value);
  const pos = speeds.indexOf(current);
  const nextSpeed = speeds[(pos+1)%speeds.length];

  box.value = String(nextSpeed);
  speed();
  document.getElementById("v2speed").innerHTML =
    "<span>⚡</span>" + nextSpeed + "×";
}

function v2Play() {
  if (!player) return;

  const state = player.getPlayerState?.();
  if (state === 1) {
    pause();
  } else {
    play();
  }
}

function v2Record() {
  const recording = document.getElementById("recordStart");
  const stopping = document.getElementById("recordStop");

  if (recorder && recorder.state === "recording") {
    stopRecording();
  } else if (recording && stopping) {
    startRecording();
    document.getElementById("recordStatus")
      .scrollIntoView({behavior:"smooth",block:"center"});
  }
}

function v2GetSaved() {
  try {
    return JSON.parse(localStorage.getItem(v2SavedKey)) || [];
  } catch {
    return [];
  }
}

function v2Pin() {
  if (selected < 0 || !cues[selected]) {
    alert("請先點選一句英文字幕");
    return;
  }

  const cue = cues[selected];
  const item = {
    text:cue.text,
    start:cue.start,
    end:cue.end,
    url:document.getElementById("url").value
  };

  let list = v2GetSaved();
  const key = x => x.url + "|" + x.start + "|" + x.text;
  const index = list.findIndex(x => key(x) === key(item));

  if (index >= 0) {
    list.splice(index,1);
  } else {
    list.unshift(item);
  }

  try {
    localStorage.setItem(v2SavedKey,JSON.stringify(list));
  } catch {
    alert("瀏覽器無法儲存收藏");
  }
  v2ShowSaved();
}

function v2ShowSaved() {
  const root = document.getElementById("v2savedList");
  if (!root) return;

  root.replaceChildren();
  const list = v2GetSaved();

  if (!list.length) {
    root.textContent = "目前沒有收藏的句子";
    return;
  }

  list.forEach(item => {
    const button = document.createElement("button");
    button.className = "line";
    button.textContent = v2Time(item.start) + " · " + item.text;
    button.onclick = () => {
      document.getElementById("url").value = item.url;
      const index = cues.findIndex(c =>
        Math.abs(c.start-item.start) < 0.1 &&
        c.text === item.text
      );
      if (index >= 0) {
        choose(index);
      } else {
        alert("請先載入這部影片與對應字幕");
      }
    };
    root.appendChild(button);
  });
}

function v2Sync() {
  if (!player?.getCurrentTime || !cues.length) return;

  const time = player.getCurrentTime();
  const total = player.getDuration?.() || 0;
  document.getElementById("v2time").textContent =
    v2Time(time) + " / " + v2Time(total);

  document.getElementById("v2fill").style.width =
    (total ? Math.min(100,time/total*100) : 0) + "%";

  const index = cues.findIndex(c =>
    time >= c.start && time < c.end
  );

  const buttons = document.querySelectorAll("#lines .line");
  buttons.forEach((b,i) => {
    b.classList.toggle("playing",i===index);
  });

  if (index >= 0 && index !== v2Last) {
    v2Last = index;
    if (selected !== index) {
      selected = index;
    }
  }
}

const v2Saved = document.createElement("section");
v2Saved.id = "v2saved";
v2Saved.innerHTML =
  "<h2>📌 我的收藏句子</h2><div id='v2savedList'></div>";

document.querySelector("main").appendChild(v2Saved);
v2ShowSaved();
setInterval(v2Sync,250);
</script>
<!-- End Shadowing AI V2 -->

</body>
</html>
