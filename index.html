
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadowing AI</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;color:#19243a;margin:0;padding:16px}
main{max-width:680px;margin:auto}
h1{text-align:center}
section{background:white;padding:15px;border-radius:14px;margin:14px 0}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px}
button{background:#345fe5;color:white;border:0;padding:11px;border-radius:9px;margin:5px 0}
.row{display:flex;gap:7px}
.row button{flex:1}
#player{width:100%;aspect-ratio:16/9;background:#111;margin:15px 0}
.line{display:block;width:100%;text-align:left;background:#edf1fa;color:#15243c;padding:12px;margin:7px 0;line-height:1.5}
.active{background:#ccdfff;border:2px solid #345fe5}
small{color:#536782}
</style>
</head>
<body>
<main>
<h1>🎧 Shadowing AI</h1>
<section>
<p>貼上 YouTube 影片連結</p>
<input id="url" placeholder="YouTube URL">
<button onclick="loadVideo()">載入影片</button>
<div id="player"></div>
<div class="row">
<button onclick="play()">▶ 播放</button>
<button onclick="pause()">⏸ 暫停</button>
</div>
<p>播放速度</p>
<select id="speed" onchange="speed()">
<option value=".5">0.5×</option>
<option value=".75">0.75×</option>
<option value="1" selected>1×</option>
<option value="1.25">1.25×</option>
<option value="1.5">1.5×</option>
</select>
<p id="status">尚未載入影片</p>
</section>

<section>
<h2>字幕與跟讀</h2>
<p><small>可從 iPhone 檔案 App 選取 SRT 或 VTT 字幕。</small></p>
<input type="file" id="file" accept=".srt,.vtt,.txt">
<p>或者貼上字幕內容</p>
<textarea id="raw" rows="4" placeholder="貼上含時間戳的字幕"></textarea>
<button onclick="importSubs()">讀取字幕</button>
<div class="row">
<button onclick="previous()">⏮ 上一句</button>
<button onclick="repeatLine()">↻ 重播</button>
<button onclick="next()">下一句 ⏭</button>
</div>
<p><label><input id="loop" type="checkbox" checked style="width:auto"> 單句循環</label></p>
<div id="lines"></div>
</section>
</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player=null,ready=false,cues=[],selected=-1,timer=null;
const el=id=>document.getElementById(id);
function onYouTubeIframeAPIReady(){ready=true}
function videoId(s){
try{
let u=new URL(s),h=u.hostname,id="";
if(h==="youtu.be"||h==="www.youtu.be")
id=u.pathname.split("/")[1];
else if(["youtube.com","www.youtube.com","m.youtube.com"].includes(h)){
if(u.pathname==="/watch")id=u.searchParams.get("v");
else id=u.pathname.split("/")[2];
}
return /^[\w-]{11}$/.test(id||"")?id:null;
}catch{return null}
}
function stopLoop(){clearInterval(timer);timer=null}
function loadVideo(){
let id=videoId(el("url").value.trim());
if(!id){el("status").textContent="請輸入有效網址";return}
if(!ready){el("status").textContent="播放器還沒準備好";return}
stopLoop();
if(player&&player.destroy)player.destroy();
el("player").outerHTML='<div id="player"></div>';
player=new YT.Player("player",{
videoId:id,
playerVars:{playsinline:1},
events:{onReady:()=>el("status").textContent="影片已載入"}
});
}
function play(){if(player?.playVideo)player.playVideo()}
function pause(){if(player?.pauseVideo)player.pauseVideo()}
function speed(){
if(player?.setPlaybackRate)
player.setPlaybackRate(Number(el("speed").value));
}
function seconds(s){
let p=s.replace(",",".").trim().split(":").map(Number);
return p.reduce((a,b)=>a*60+b,0);
}
function parseSubs(text){
let result=[];
for(let block of text.replace(/\r/g,"").split(/\n\s*\n/)){
let rows=block.trim().split("\n");
let i=rows.findIndex(x=>x.includes("-->"));
if(i<0)continue;
let parts=rows[i].split("-->").map(x=>x.trim().split(/\s+/)[0]);
let start=seconds(parts[0]),end=seconds(parts[1]);
let words=rows.slice(i+1).join(" ").replace(/<[^>]+>/g,"").trim();
if(Number.isFinite(start)&&Number.isFinite(end)&&end>start&&words)
result.push({start,end,text:words});
}
return result.sort((a,b)=>a.start-b.start);
}
function importSubs(){
stopLoop();
cues=parseSubs(el("raw").value);
selected=-1;
render();
el("status").textContent="已讀取 "+cues.length+" 段字幕";
}
el("file").onchange=async e=>{
let f=e.target.files[0];
if(f){el("raw").value=await f.text();importSubs()}
};
function stamp(n){
return String(Math.floor(n/60)).padStart(2,"0")+":"+
String(Math.floor(n%60)).padStart(2,"0");
}
function render(){
let root=el("lines");
root.replaceChildren();
cues.forEach((c,i)=>{
let b=document.createElement("button");
b.className="line"+(i===selected?" active":"");
b.textContent=stamp(c.start)+" — "+c.text;
b.onclick=()=>choose(i);
root.appendChild(b);
});
}
function choose(i){
if(i<0||i>=cues.length)return;
selected=i;
render();
let c=cues[i];
stopLoop();
if(player?.seekTo){
player.seekTo(c.start,true);
player.playVideo();
speed();
}
timer=setInterval(()=>{
if(!player?.getCurrentTime)return;
if(player.getCurrentTime()>=c.end-.1){
if(el("loop").checked){
player.seekTo(c.start,true);
player.playVideo();
}else{
player.pauseVideo();
stopLoop();
}
}
},200);
}
function repeatLine(){if(selected>=0)choose(selected)}
function previous(){if(cues.length)choose(Math.max(0,selected-1))}
function next(){if(cues.length)choose(Math.min(cues.length-1,selected+1))}
</script>
  
<section>
  <h2>🎙️ 我的英文跟讀錄音</h2>
  <p>聽完原聲後，錄下自己的發音。</p>

  <div class="row">
    <button id="recordStart" onclick="startRecording()">
      🔴 開始錄音
    </button>
    <button id="recordStop" onclick="stopRecording()" disabled>
      ⏹ 停止錄音
    </button>
  </div>

  <p id="recordStatus">尚未錄音</p>

  <audio id="myRecording" controls
    style="width:100%;margin-top:10px"></audio>

  <p>
    <small>
      錄音只會保存在目前瀏覽器頁面中，
      不會自動上傳到伺服器。
      重新整理後可能消失。
    </small>
  </p>
</section>

<script>
let recorder = null;
let recordingChunks = [];
let micStream = null;
let recordingURL = null;

async function startRecording() {
  const message = document.getElementById("recordStatus");

  if (!navigator.mediaDevices?.getUserMedia ||
      !window.MediaRecorder) {
    message.textContent = "目前瀏覽器不支援錄音";
    return;
  }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    const options = {};
    if (MediaRecorder.isTypeSupported("audio/mp4")) {
      options.mimeType = "audio/mp4";
    } else if (
      MediaRecorder.isTypeSupported("audio/webm")
    ) {
      options.mimeType = "audio/webm";
    }

    recorder = new MediaRecorder(micStream, options);
    recordingChunks = [];

    recorder.ondataavailable = event => {
      if (event.data.size > 0) {
        recordingChunks.push(event.data);
      }
    };

    recorder.onstop = () => {
      const blob = new Blob(recordingChunks, {
        type: recorder.mimeType || "audio/mp4"
      });

      if (recordingURL) {
        URL.revokeObjectURL(recordingURL);
      }

      recordingURL = URL.createObjectURL(blob);
      document.getElementById("myRecording").src =
        recordingURL;

      message.textContent = "✅ 錄音完成！可以按播放聽自己的聲音";

      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
    };

    if (typeof stopLoop === "function") stopLoop();
    if (typeof pause === "function") pause();

    recorder.start();

    document.getElementById("recordStart").disabled = true;
    document.getElementById("recordStop").disabled = false;
    message.textContent = "🔴 正在錄音中…";

  } catch (error) {
    message.textContent =
      "無法錄音，請確認已允許麥克風權限";
    if (micStream) {
      micStream.getTracks().forEach(track => track.stop());
    }
  }
}

function stopRecording() {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
  }

  document.getElementById("recordStart").disabled = false;
  document.getElementById("recordStop").disabled = true;
}
</script>

</body>
</html>
